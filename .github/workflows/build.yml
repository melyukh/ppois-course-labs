name: Build Release Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.pick.outputs.labs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find lab folders
        id: pick
        run: |
          labs=$(ls -d lab*/ 2>/dev/null | sed 's#/$##' | jq -R . | jq -sc .)
          echo "Лабы: $labs"
          echo "labs=$labs" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.labs != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.detect.outputs.labs) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip archive (${{ matrix.lab }})
        working-directory: ${{ matrix.lab }}
        run: |
          mkdir -p ../dist
          zip -r ../dist/${{ matrix.lab }}-${{ github.sha }}.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*coverage.xml" \
            -x "*htmlcov*" \
            -x "tests/*" \
            -x "*/tests/*" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "pytest.ini" \
            -x ".coveragerc"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-build-${{ github.sha }}
          path: dist/${{ matrix.lab }}-${{ github.sha }}.zip
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # права на создание релиза, не зависят от настройки репозитория

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build-${{ github.sha }}"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release with archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}