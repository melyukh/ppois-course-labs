name: Build Release Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lab1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip archive
        working-directory: lab1
        run: |
          mkdir -p ../dist
          zip -r ../dist/lab1-${{ github.sha }}.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*coverage.xml" \
            -x "*htmlcov*" \
            -x "tests/*" \
            -x "*/tests/*" \
            -x "pytest.ini" \
            -x ".coveragerc"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1-build-${{ github.sha }}
          path: dist/lab1-${{ github.sha }}.zip
          retention-days: 30

      - name: Create GitHub Release with archive
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-lab1-${{ github.run_number }}
          name: "Lab 1 build #${{ github.run_number }}"
          files: dist/lab1-${{ github.sha }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-lab4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip archive
        working-directory: lab4
        run: |
          mkdir -p ../dist
          zip -r ../dist/lab4-${{ github.sha }}.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x "*.pyc" \
            -x "*coverage.xml" \
            -x "*htmlcov*" \
            -x "tests/*" \
            -x "*/tests/*" \
            -x "conftest.py" \
            -x "pytest.ini" \
            -x ".coveragerc"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-build-${{ github.sha }}
          path: dist/lab4-${{ github.sha }}.zip
          retention-days: 30

      - name: Create GitHub Release with archive
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-lab4-${{ github.run_number }}
          name: "Lab 4 build #${{ github.run_number }}"
          files: dist/lab4-${{ github.sha }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}